memory_limit = 256M                             ; max memory a PHP script can use before being killed
                                                ; WordPress can be heavy, 256M is safe for most sites
max_execution_time = 300                        ; max seconds a PHP script can run before being killed 
                                                ; 300 = 5 minutes, covers plugin updates and media uploads ← soft limit, only stops script execution
max_input_time = 300                            ; max seconds PHP spends parsing form/request data
                                                ; same reason as above — covers large uploads ← soft limit, only stops input parsing